<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Zaoblené tmavé pozadí -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)" stroke="url(#grad)" stroke-width="2.5"/>

  <!-- Stylizované písmeno Y a L v moderní geometrii -->
  <path d="M19 18 L27 31 L27 46" fill="none" stroke="url(#grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M35 18 L27 31" fill="none" stroke="url(#grad)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M35 28 L35 46 L45 46" fill="none" stroke="#facc15" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Malá zářící jiskra nahoře -->
  <circle cx="43" cy="20" r="2.5" fill="#facc15"/>
</svg>
